#  ************ 【渲染设置】 *************
#  渲染精细度，可选值50~200，建议100
renderScale: 100

#  渲染质量 可选值1~100
randerQuality: 100

#  渲染超时时间 ms
timeout: 20000

#  等待渲染超时时间 ms
waitingTimeout: 10000

#  ************ 【系统设置】 *************

#  b20最大成绩数量
B20MaxNum: 50

#  命令头（默认mil，即命令格式为 #mil song xxx）
cmdhead: "mil"

#  多个曲目回复序号等待时长(s)
mutiNickWaitTimeOut: 30

#  是否开启频道模式
isGuild: false

#  是否开启官方Bot模式（开启后存档差异仅限私信 + 授权链接转为二维码）
officialBotMode: false

#  ************ 【曲绘资源】 *************

#  曲绘仓库地址（Git 克隆地址）
illDownloadUrl: "https://github.com/Temmie0125/mil-plugin-ill-low"

#  GitHub 代理（留空或 false 则不使用）
#  国内用户可设为 https://gh-proxy.com/ 等加速站点
githubProxy: false

#  插件更新后是否自动更新曲绘（true/false）
autoPullIll: false

#  ************ 【云存档设置】 *************

# 存档更新记录在 update 界面最多展示条数（10~99）
# 注：更新记录已改为永久保留，此配置仅控制界面展示数量
maxUpdateEntries: 30

#  Milthm 云存档 OIDC client_id（留空禁用）
client_id: ""

#  Milthm 云存档 OIDC client_secret（留空禁用）
client_secret: ""

#  Re Nya Profiler API Key（留空禁用）
#  在 https://renya.mhtlim.top/apikey 创建
#  优先级低于官方 OIDC（client_id），仅当 client_id 未配置时才使用此接口
nya_api_key: ""

#  Nya Profiler 缓存有效期（小时），最小 1 小时，默认 2 小时
#  缓存有效期内重复请求将提示用户等待，避免浪费每日下载次数（上限5次/天）
nyaCacheTTL: 2

#  ************ 【猜曲游戏】 *************

#  【开字母（Letter Game）设置】
#  开字母每局曲目数量，可选 5~12
LetterNum: 8

#  开字母单局时长 (秒)
LetterTimeLength: 300

#  开字母翻字母全局冷却时间 (秒)
LetterRevealCd: 5

#  开字母猜测全局冷却时间 (秒)
LetterGuessCd: 3

#  开字母使用提示全局冷却时间 (秒)
LetterTipCd: 15

#  开字母猜对后曲绘展示方式: "水印版" / "不展示"
LetterIllustration: "水印版"

#  开字母曲目标题显示模式: "默认"（优先中文）/ "拉丁文优先"（优先拉丁字母标题）
LetterTitleMode: "默认"

#  【猜曲绘（Guess Illustration）设置】
#  猜曲绘提示间隔 (秒)
GuessTipCd: 15

#  猜曲绘提示是否撤回上一张图 (true/false)
GuessTipRecall: true

#  猜曲绘单局最大时长 (秒)
GuessMaxTime: 270
